# Конфиг nginx ВНУТРИ контейнера фронтенда: отдача статики Vite-сборки.
# Наружу контейнер публикуется только на 127.0.0.1:8080 (см. docker-compose.frontend.yml),
# внешний трафик проксирует системный nginx хоста.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip для текстовых ресурсов
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Собранные ассеты Vite имеют хэш в имени — кэшируем надолго.
    # Один заголовок вместо пары expires + add_header: директива expires
    # добавляет СВОЙ Cache-Control, и заголовок уходил дважды.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # index.html кешировать НЕЛЬЗЯ: он ссылается на хэшированные ассеты, и
    # закешированная копия после обновления тянет старые JS — пользователь
    # видит прежний интерфейс, пока не сделает жёсткое обновление.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # SPA: любой маршрут отдаёт index.html (hash-роутинг #/admin, #/cabinet)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
