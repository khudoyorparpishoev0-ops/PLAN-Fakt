# Конфиг nginx ВНУТРИ контейнера фронтенда: отдача статики Vite-сборки.
# Наружу контейнер публикуется только на 127.0.0.1:8080 (см. docker-compose.frontend.yml),
# внешний трафик проксирует системный nginx хоста.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip для текстовых ресурсов
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Собранные ассеты Vite имеют хэш в имени — кэшируем надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любой маршрут отдаёт index.html (hash-роутинг #/admin, #/cabinet)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
